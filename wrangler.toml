name = "sentiment-youtube"
main = "src/worker.js"
compatibility_date = "2024-01-01"

[env.production]
name = "sentiment-youtube-prod"

[build]
command = "npm install"
cwd = "."
# Permite importar la herramienta Radar (tools/*.html) como texto
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
